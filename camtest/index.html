<body>
<noscript>
  <h1>Bookswappin’ BCN · Free book swap in Barcelona</h1>

<script>
  // Tells the site which website sent the visitor and if it was opened as a home screen app (for the admin stats)
  var q = new URLSearchParams(location.search);
  try { var r = document.referrer ? new URL(document.referrer).hostname : ''; if (r && r.indexOf('bookswappin') < 0) q.set('ref', r); } catch (e) {}
  try {
    if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
      q.set('app', '1');
      // The first time the home screen app opens on this phone counts as an install (for the admin stats)
      if (!localStorage.getItem('bsw_app')) { localStorage.setItem('bsw_app', '1'); q.set('inst', '1'); }
    }
  } catch (e) {}
  var qs = q.toString();
  var app = document.getElementById('app'), load = document.getElementById('load');
  // The site says when the shelf is on screen; until then the loading screen stays (at most 12 seconds, just in case)
  var gone = false;
  function done() { if (gone) return; gone = true; load.className = 'gone'; setTimeout(function () { load.remove(); }, 400); }
  setTimeout(done, 12000);
  document.getElementById('app').src = 'https://script.google.com/macros/s/AKfycbx2CEBslK1M_8V6O5fmsDIwkzRkIaBqTNRzLyoqWD_SYh_xMehpDR8h-qJBr_pplXY8/exec' + (qs ? '?' + qs : '');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
  // Keeps a copy of the sign-in for the site, so people stay signed in when a new version goes live
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data || {};
    try {
      if (d.bsw === 'me') { if (d.me) localStorage.setItem('bsw_me', d.me); else localStorage.removeItem('bsw_me'); }
      if (d.bsw === 'ready') done();
      if (d.bsw === 'get' && e.source) e.source.postMessage({ bsw: 'me', me: localStorage.getItem('bsw_me') }, e.origin);
    } catch (err) {}
  });

  // Cover photos: the site asks for the camera here, sees a book-shaped frame, and gets back just the cover
  (function () {
    var cam = document.getElementById('cam'), video = document.getElementById('camVideo'), frame = document.getElementById('camFrame');
    var stream = null, asker = null, askerOrigin = '';
    function reply(d) { try { if (asker) asker.postMessage(Object.assign({ bsw: 'photo' }, d), askerOrigin); } catch (e) {} }
    function close() { document.getElementById('camLoad').hidden = true; if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; video.srcObject = null; cam.hidden = true; clearTimeout(loopT); }
    // Live guidance: a small AI model that recognises books runs on the phone and compares the book to the frame.
    // It only gives advice: the shutter always works.
    var model = null, modelP = null, loopT = 0, probe = document.createElement('canvas');
    function addScript(src) { return new Promise(function (ok, no) { var el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = no; document.head.appendChild(el); }); }
    function loadModel() {
      var ld = document.getElementById('camLoad');
      if (!model && !modelP) ld.hidden = false;
      if (!modelP) modelP = addScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js')
        .then(function () { return addScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js'); })
        .then(function () { return window.cocoSsd.load({ base: 'lite_mobilenet_v2' }); })
        .then(function (m) { model = m; ld.hidden = true; return m; })
        .catch(function () { modelP = null; ld.hidden = true; return null; });
      return modelP;
    }
    function tip(t, sub, ok) {
      var el = document.getElementById('camTip');
      el.querySelector('b').textContent = t; el.querySelector('span').textContent = sub || '';
      el.classList.toggle('ok', !!ok); frame.classList.toggle('ok', !!ok);
    }
    function guide() {
      if (cam.hidden || !stream || !video.videoWidth) { loopT = setTimeout(guide, 300); return; }
      var vw = video.videoWidth, vh = video.videoHeight, W = cam.clientWidth, H = cam.clientHeight;
      var s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2, r = frame.getBoundingClientRect();
      // How bright the frame is
      probe.width = 24; probe.height = 36;
      var pc = probe.getContext('2d', { willReadFrequently: true });
      pc.drawImage(video, (r.left - ox) / s, (r.top - oy) / s, r.width / s, r.height / s, 0, 0, 24, 36);
      var px = pc.getImageData(0, 0, 24, 36).data, lum = 0;
      for (var i = 0; i < px.length; i += 4) lum += px[i] * .299 + px[i + 1] * .587 + px[i + 2] * .114;
      lum /= px.length / 4;
      if (lum < 45) { tip('Too dark', 'Find a bit more light'); loopT = setTimeout(guide, 400); return; }
      if (!model) { tip('Fit the cover inside the frame', 'Lay the book flat, in good light'); loopT = setTimeout(guide, 400); return; }
      model.detect(video, 5, 0.3).then(function (list) {
        if (cam.hidden) return;
        var fx = r.left, fy = r.top, fw = r.width, fh = r.height, best = null, bestIn = 0;
        list.forEach(function (p) {
          if (p.class !== 'book') return;
          var x = p.bbox[0] * s + ox, y = p.bbox[1] * s + oy, w = p.bbox[2] * s, h = p.bbox[3] * s;
          var ix = Math.max(0, Math.min(x + w, fx + fw) - Math.max(x, fx)), iy = Math.max(0, Math.min(y + h, fy + fh) - Math.max(y, fy));
          if (ix * iy > bestIn) { bestIn = ix * iy; best = { x: x, y: y, w: w, h: h }; }
        });
        if (!best) tip('Fit the cover inside the frame', 'Lay the book flat, in good light');
        else {
          var fill = bestIn / (fw * fh), big = (best.w * best.h) / (fw * fh);
          var dx = Math.abs(best.x + best.w / 2 - (fx + fw / 2)) / fw, dy = Math.abs(best.y + best.h / 2 - (fy + fh / 2)) / fh;
          if (big > 1.7) tip('Move back a little', 'The whole cover should fit in the frame');
          else if (fill < 0.5 && dx < 0.2 && dy < 0.2) tip('Move closer', 'Fill the frame with the cover');
          else if (dx > 0.15 || dy > 0.15) tip('Centre the book', 'Line the cover up with the frame');
          else if (fill < 0.62) tip('A little closer', 'Almost there');
          else tip('Looks good!', 'Take the photo', true);
        }
        loopT = setTimeout(guide, 250);
      }).catch(function () { loopT = setTimeout(guide, 600); });
    }
    function open(src, origin) {
      asker = src; askerOrigin = origin;
      document.getElementById('camMsg').hidden = true; frame.hidden = false; document.getElementById('camShot').disabled = false;
      cam.hidden = false;
      tip('Fit the cover inside the frame', 'Lay the book flat, in good light');
      loadModel(); clearTimeout(loopT); loopT = setTimeout(guide, 500);
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return blocked();
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1080 }, height: { ideal: 1920 }, aspectRatio: { ideal: 9 / 16 } }, audio: false })
        .then(function (s) {
          stream = s; video.srcObject = s;
          try { var tr = s.getVideoTracks()[0], caps = tr.getCapabilities ? tr.getCapabilities() : {}; if (caps.zoom) tr.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }).catch(function () {}); } catch (e) {}
          return video.play();
        })
        .catch(blocked);
    }
    function blocked() {
      var m = document.getElementById('camMsg');
      m.textContent = 'The camera is blocked. Allow it for bookswappin.com in your browser settings, or pick a photo from your gallery.';
      m.hidden = false; frame.hidden = true; document.getElementById('camShot').disabled = true; tip('Camera blocked', '');
    }
    document.getElementById('camCancel').onclick = function () { close(); reply({ cancel: true }); };
    // Takes just what's inside the frame
    document.getElementById('camShot').onclick = function () {
      if (!stream || !video.videoWidth) return;
      var f = document.getElementById('camFlash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
      var vw = video.videoWidth, vh = video.videoHeight, W = cam.clientWidth, H = cam.clientHeight;
      var s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2, r = frame.getBoundingClientRect();
      var c = document.createElement('canvas'); c.width = 720; c.height = 1080;
      c.getContext('2d').drawImage(video, (r.left - ox) / s, (r.top - oy) / s, r.width / s, r.height / s, 0, 0, 720, 1080);
      var data = c.toDataURL('image/jpeg', 0.86);
      setTimeout(function () { close(); reply({ data: data }); }, 180);
    };
    // A photo from the gallery goes back whole, so the site can crop it
    document.getElementById('camFile').onchange = function (e) {
      var file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return;
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        close(); reply({ data: c.toDataURL('image/jpeg', 0.88), raw: true });
      };
      img.onerror = function () { URL.revokeObjectURL(url); close(); reply({ error: 'file' }); };
      img.src = url;
    };
    window.addEventListener('message', function (e) {
      if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
      var d = e.data || {};
      if (d.bsw === 'hello' && e.source) e.source.postMessage({ bsw: 'hi', cam: true }, e.origin);
      if (d.bsw === 'camera' && e.source) open(e.source, e.origin);
    });
  })();
</script>
