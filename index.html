<script>
  // Tells the site which website sent the visitor and if it was opened as a home screen app (for the admin stats)
  var q = new URLSearchParams(location.search);
  try { var r = document.referrer ? new URL(document.referrer).hostname : ''; if (r && r.indexOf('bookswappin') < 0) q.set('ref', r); } catch (e) {}
  try { if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) q.set('app', '1'); } catch (e) {}
  var qs = q.toString();
  // Hides the loading screen once the site has loaded (or after 10 seconds, just in case)
  var app = document.getElementById('app'), load = document.getElementById('load');
  function done() { load.className = 'gone'; setTimeout(function () { load.remove(); }, 400); }
  app.addEventListener('load', done, { once: true });
  setTimeout(done, 10000);
  document.getElementById('app').src = 'https://script.google.com/macros/s/AKfycbx2CEBslK1M_8V6O5fmsDIwkzRkIaBqTNRzLyoqWD_SYh_xMehpDR8h-qJBr_pplXY8/exec' + (qs ? '?' + qs : '');

  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;

  });
